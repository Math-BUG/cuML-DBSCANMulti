name: CI CPU

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  metadata-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CPU test and metadata dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements.txt -r requirements-ci.txt

      - name: Compile Python sources
        run: python -m compileall -q tools scripts tests

      - name: Run CPU tests
        run: python -m pytest -q

      - name: Validate schemas, provenance and file licenses
        run: python scripts/check_repo_metadata.py

      - name: Parse shell and Slurm scripts
        run: |
          for file in scripts/*.sh scripts/*.slm; do
            bash -n "$file"
          done

      - name: Validate build configuration matrix without CUDA
        run: |
          make check-config-matrix
          make dry-run-matrix

      - name: Check whitespace
        run: git diff --check
